name: Verify extension

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: chatty-for-twitch-${{ github.sha }}
          path: dist/chatty-for-twitch.zip
